<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">ניהול ארכיון — Knowledge Graph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --text-dim: #6e6e80;
    --accent-red: #ff4d6a;
    --accent-blue: #4d8bff;
    --accent-green: #3dd68c;
    --accent-orange: #ff9f43;
    --accent-purple: #a855f7;
    --accent-cyan: #22d3ee;
    --accent-pink: #f472b6;
    --glow: rgba(77, 139, 255, 0.15);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(10,10,15,0.95), rgba(10,10,15,0));
    pointer-events: none;
  }

  .header > * { pointer-events: auto; }

  .logo {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-blue);
    box-shadow: 0 0 12px var(--accent-blue);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .stats span {
    color: var(--text);
    font-weight: 600;
  }

  .admin-mode-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--accent-orange);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .admin-mode-indicator.show { display: flex; }

  .admin-mode-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-orange);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .search-box {
    position: fixed;
    top: 60px;
    right: 24px;
    z-index: 100;
  }

  .search-box input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    width: 240px;
    outline: none;
    direction: rtl;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px var(--glow);
  }

  .search-box input::placeholder { color: var(--text-dim); }

  /* ── Info Panel (left) ── */
  .panel {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 380px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    padding: 24px;
  }

  .panel.open { transform: translateX(0); }

  .panel-close {
    position: absolute;
    top: 16px;
    left: 16px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: background 0.2s;
  }

  .panel-close:hover { background: rgba(255,255,255,0.05); color: var(--text); }

  .panel-category {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .panel-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .panel-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .panel-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #b0b0c0;
    margin-bottom: 20px;
  }

  .panel-connections-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .panel-connection {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 13px;
  }

  .panel-connection:hover { background: rgba(255,255,255,0.04); }

  .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .panel-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-blue);
    font-size: 13px;
    text-decoration: none;
    margin-top: 4px;
    transition: opacity 0.2s;
  }

  .panel-link:hover { opacity: 0.7; }

  /* ── Legend ── */
  .legend {
    position: fixed;
    bottom: 20px;
    right: 24px;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 500px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(18,18,26,0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .legend-item:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

  .legend-item.active {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
    background: rgba(30,30,46,0.9);
  }

  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Tooltip ── */
  .tooltip {
    position: fixed;
    z-index: 300;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 250px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .tooltip.show { opacity: 1; }
  .tooltip-name { font-weight: 600; margin-bottom: 2px; }
  .tooltip-cat { font-size: 10px; color: var(--text-dim); }

  /* ── Controls ── */
  .controls {
    position: fixed;
    bottom: 20px;
    left: 24px;
    z-index: 100;
    display: flex;
    gap: 6px;
  }

  .ctrl-btn {
    background: rgba(18,18,26,0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }

  .ctrl-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

  .ctrl-btn.admin-active {
    border-color: var(--accent-orange);
    color: var(--accent-orange);
    box-shadow: 0 0 10px rgba(255, 159, 67, 0.2);
  }

  /* ══════════════════════════════════════
     ADMIN MODAL
  ══════════════════════════════════════ */
  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .admin-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .admin-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px 28px;
    width: 340px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.7);
    direction: rtl;
    transform: translateY(-10px);
    transition: transform 0.2s;
  }

  .admin-overlay.show .admin-modal {
    transform: translateY(0);
  }

  .admin-modal-icon {
    text-align: center;
    font-size: 36px;
    margin-bottom: 14px;
    line-height: 1;
  }

  .admin-modal-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }

  .admin-modal-sub {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 24px;
  }

  .admin-modal input[type="password"] {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 8px;
    outline: none;
    margin-bottom: 10px;
    direction: ltr;
    text-align: center;
    letter-spacing: 4px;
    transition: border-color 0.2s;
  }

  .admin-modal input[type="password"]:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px var(--glow);
  }

  .admin-modal input[type="password"]::placeholder {
    letter-spacing: 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  .admin-error {
    font-size: 12px;
    color: var(--accent-red);
    text-align: center;
    margin-bottom: 10px;
    min-height: 16px;
    transition: opacity 0.2s;
  }

  .admin-modal-btn {
    width: 100%;
    background: var(--accent-blue);
    border: none;
    color: #fff;
    font-family: 'Rubik', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 8px;
  }

  .admin-modal-btn:hover { opacity: 0.88; }
  .admin-modal-btn:active { transform: scale(0.98); }

  .admin-modal-cancel {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    padding: 7px;
    cursor: pointer;
    transition: color 0.2s;
    border-radius: 6px;
  }

  .admin-modal-cancel:hover { color: var(--text); }

  /* ══════════════════════════════════════
     ADMIN PANEL (right side)
  ══════════════════════════════════════ */
  .admin-panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 420px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }

  .admin-panel.open { transform: translateX(0); }

  .admin-panel-header {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    flex-shrink: 0;
  }

  .admin-panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
  }

  .admin-badge {
    background: var(--accent-orange);
    color: #000;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .admin-panel-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: background 0.2s;
  }

  .admin-panel-close:hover { background: rgba(255,255,255,0.05); color: var(--text); }

  /* Tabs */
  .admin-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .admin-tab {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Rubik', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .admin-tab:hover { color: var(--text); }

  .admin-tab.active {
    color: var(--accent-blue);
    border-bottom-color: var(--accent-blue);
  }

  /* Tab content */
  .admin-tab-content {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
  }

  .admin-tab-content.active { display: block; }

  /* Sections */
  .admin-section { margin-bottom: 26px; }

  .admin-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .admin-field { margin-bottom: 12px; }

  .admin-field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }

  /* Shared input styles */
  .admin-input, .admin-textarea, .admin-node-search {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    border-radius: 6px;
    outline: none;
    direction: rtl;
    transition: border-color 0.2s, background 0.2s;
    box-sizing: border-box;
  }

  .admin-input:focus, .admin-textarea:focus, .admin-node-search:focus {
    border-color: var(--accent-blue);
    background: rgba(77, 139, 255, 0.05);
  }

  .admin-input { font-size: 13px; padding: 8px 12px; }
  .admin-textarea {
    font-size: 12px;
    padding: 8px 12px;
    resize: vertical;
    min-height: 64px;
    line-height: 1.55;
  }

  .admin-node-search {
    font-size: 13px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }

  .admin-node-search::placeholder { color: var(--text-dim); }

  /* Node list items */
  .admin-node-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }

  .admin-node-item:hover { border-color: rgba(255,255,255,0.1); }

  .admin-node-item-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
  }

  .admin-node-cat-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .admin-node-cat-label { font-size: 10px; color: var(--text-dim); }

  .admin-node-label-input {
    margin-bottom: 6px;
    font-weight: 500;
  }

  .admin-desc-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    font-family: 'Rubik', sans-serif;
    transition: color 0.2s;
  }

  .admin-desc-toggle:hover { color: var(--accent-blue); }

  .admin-desc-area {
    margin-top: 7px;
    display: none;
  }

  .admin-desc-area.open { display: block; }

  /* Category list items */
  .admin-cat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .admin-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .admin-cat-input { flex: 1; }

  /* Footer */
  .admin-panel-footer {
    border-top: 1px solid var(--border);
    padding: 14px 18px;
    flex-shrink: 0;
  }

  .admin-logout-btn {
    width: 100%;
    background: rgba(255, 77, 106, 0.08);
    border: 1px solid rgba(255, 77, 106, 0.25);
    color: var(--accent-red);
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .admin-logout-btn:hover { background: rgba(255, 77, 106, 0.15); }

  /* ══════════════════════════════════════
     LOGO VERSION + SUB
  ══════════════════════════════════════ */
  .logo-text-wrap { display: flex; flex-direction: column; gap: 3px; }

  .logo-main-row { display: flex; align-items: center; gap: 8px; }

  .logo-version {
    font-size: 10px;
    font-weight: 600;
    background: rgba(77,139,255,0.15);
    color: var(--accent-blue);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    font-family: 'Rubik', sans-serif;
    flex-shrink: 0;
  }

  .logo-sub {
    font-size: 9px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Rubik', sans-serif;
  }

  /* ══════════════════════════════════════
     DRIVE CAROUSEL
  ══════════════════════════════════════ */
  .carousel-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .carousel-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .carousel-title-txt {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  .carousel-counter { font-size: 11px; color: var(--text-dim); }

  .carousel-item { display: none; }
  .carousel-item.active { display: block; }

  .carousel-item a { text-decoration: none; color: var(--text); }

  .carousel-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .carousel-thumb:hover { border-color: rgba(255,255,255,0.15); }

  .carousel-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .carousel-thumb.thumb-error { display: flex; align-items: center; justify-content: center; }
  .carousel-thumb.thumb-error img { display: none; }
  .carousel-thumb.thumb-error::after { content: '🖼'; font-size: 36px; }

  .carousel-play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.4);
    pointer-events: none;
  }

  .carousel-name {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: ltr;
    text-align: left;
  }

  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .carousel-arrow {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .carousel-arrow:hover { background: rgba(255,255,255,0.1); }

  .carousel-no-key {
    text-align: center;
    padding: 20px 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .carousel-no-key-icon { font-size: 28px; margin-bottom: 8px; }

  .carousel-loading {
    text-align: center;
    padding: 24px 0;
    font-size: 12px;
    color: var(--text-dim);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .admin-save-btn {
    width: 100%;
    background: var(--accent-green);
    border: none;
    color: #000;
    font-family: 'Rubik', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 8px;
  }

// ── CANVAS & SIMULATION ──
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const nodeMap = {};
nodes.forEach((n, i) => {
  const angle = (i / nodes.length) * Math.PI * 2;
  const r = 150 + Math.random() * 200;
  n.x  = W / 2 + Math.cos(angle) * r;
  n.y  = H / 2 + Math.sin(angle) * r;
  n.vx = 0; n.vy = 0;
  nodeMap[n.id] = n;
});

let cam       = { x: 0, y: 0, zoom: 1 };
let targetCam = { x: 0, y: 0, zoom: 1 };

function screenToWorld(sx, sy) {
  return { x: (sx - W/2) / cam.zoom + W/2 + cam.x,
           y: (sy - H/2) / cam.zoom + H/2 + cam.y };
}

function simulate() {
  const repulsion  = 8000;
  const attraction = 0.0004;
  const damping    = 0.85;
  const centerPull = 0.001;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    a.vx += (W/2 - a.x) * centerPull;
    a.vy += (H/2 - a.y) * centerPull;
    for (let j = i+1; j < nodes.length; j++) {
      const b  = nodes[j];
      let dx   = a.x - b.x, dy = a.y - b.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let f    = repulsion / (dist * dist);
      let fx   = (dx/dist)*f, fy = (dy/dist)*f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }

  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    let dx   = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx*dx + dy*dy) || 1;
    let target = 180 / (e.strength || 0.5);
    let f  = (dist - target) * attraction * (e.strength || 0.5);
    let fx = (dx/dist)*f, fy = (dy/dist)*f;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  nodes.forEach(n => {
    n.vx *= damping; n.vy *= damping;
    n.x  += n.vx;    n.y  += n.vy;
  });
}

// ── INTERACTION STATE ──
let hoveredNode  = null;
let selectedNode = null;
let dragging     = null;
let dragOffset   = { x: 0, y: 0 };
let isPanning    = false;
let panStart     = { x: 0, y: 0 };
let activeCategory = null;
let searchTerm   = '';

// ── DRAW ──
function draw() {
  ctx.clearRect(0, 0, W, H);

  cam.x    += (targetCam.x    - cam.x)    * 0.08;
  cam.y    += (targetCam.y    - cam.y)    * 0.08;
  cam.zoom += (targetCam.zoom - cam.zoom) * 0.08;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-W/2 - cam.x, -H/2 - cam.y);

  // Edges
  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    let alpha = 0.08 + (e.strength||0.5) * 0.12;
    const focus = hoveredNode || selectedNode;
    if (focus) {
      alpha = (e.from === focus.id || e.to === focus.id)
        ? 0.4 + (e.strength||0.5)*0.4
        : 0.02;
    }
    if (activeCategory && a.cat !== activeCategory && b.cat !== activeCategory) alpha = 0.02;
    if (searchTerm && !a.label.includes(searchTerm) && !b.label.includes(searchTerm)) alpha = 0.02;

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(100,120,160,${alpha})`;
    ctx.lineWidth   = 0.5 + (e.strength||0.5)*1.5;
    ctx.stroke();
  });

  // Nodes
  nodes.forEach(n => {
    const cat = categories[n.cat];
    let alpha = 1, sizeMultiplier = 1;
    const focus = hoveredNode || selectedNode;
    if (focus) {
      if (n.id === focus.id) {
        sizeMultiplier = 1.15;
      } else {
        const connected = edges.some(e =>
          (e.from === focus.id && e.to === n.id) ||
          (e.to   === focus.id && e.from === n.id)
        );
        alpha = connected ? 0.9 : 0.15;
      }
    }
    if (activeCategory && n.cat !== activeCategory) alpha = 0.12;
    if (searchTerm) alpha = n.label.includes(searchTerm) ? 1 : 0.1;

    const r = (n.size / 2) * sizeMultiplier;

    if (alpha > 0.5) {
      const grad = ctx.createRadialGradient(n.x, n.y, r*0.5, n.x, n.y, r*3);
      grad.addColorStop(0, cat.color + '30');
      grad.addColorStop(1, cat.color + '00');
      ctx.beginPath();
      ctx.arc(n.x, n.y, r*3, 0, Math.PI*2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle   = cat.color + Math.round(alpha*200).toString(16).padStart(2,'0');
    ctx.fill();
    ctx.strokeStyle = cat.color + Math.round(alpha*100).toString(16).padStart(2,'0');
    ctx.lineWidth   = 1;
    ctx.stroke();

    if (cam.zoom > 0.5 && r * cam.zoom > 6) {
      const fontSize = Math.max(9, Math.min(13, r*0.8));
      ctx.font      = `500 ${fontSize}px Rubik`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(255,255,255,${alpha*0.9})`;
      const maxW = r * 4;
      let label = n.label;
      if (ctx.measureText(label).width > maxW) {
        while (ctx.measureText(label+'…').width > maxW && label.length > 3)
          label = label.slice(0,-1);
        label += '…';
      }
      ctx.fillText(label, n.x, n.y + r + fontSize + 2);
    }
  });

  ctx.restore();
  simulate();
  requestAnimationFrame(draw);
}

// ── MOUSE / TOUCH ──
function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  for (let i = nodes.length-1; i >= 0; i--) {
    const n = nodes[i];
    const dx = w.x - n.x, dy = w.y - n.y;
    const r  = n.size/2 + 5;
    if (dx*dx + dy*dy < r*r) return n;
  }
  return null;
}

canvas.addEventListener('mousemove', e => {
  if (isPanning) {
    targetCam.x -= (e.clientX - panStart.x) / cam.zoom;
    targetCam.y -= (e.clientY - panStart.y) / cam.zoom;
    panStart = { x: e.clientX, y: e.clientY };
    return;
  }
  if (dragging) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragging.x = w.x + dragOffset.x;
    dragging.y = w.y + dragOffset.y;
    dragging.vx = dragging.vy = 0;
    return;
  }
  const node = getNodeAt(e.clientX, e.clientY);
  hoveredNode = node;
  canvas.style.cursor = node ? 'pointer' : 'grab';
  const tip = document.getElementById('tooltip');
  if (node) {
    tip.classList.add('show');
    document.getElementById('tooltipName').textContent = node.label;
    document.getElementById('tooltipCat').textContent  = categories[node.cat].label;
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 10) + 'px';
  } else {
    tip.classList.remove('show');
  }
});

canvas.addEventListener('mousedown', e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragging   = node;
    dragOffset = { x: node.x - w.x, y: node.y - w.y };
  } else {
    isPanning = true;
    panStart  = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mouseup', e => {
  if (dragging && !isPanning) {
    const node = getNodeAt(e.clientX, e.clientY);
    if (node && node === dragging) openPanel(node);
  }
  dragging = null; isPanning = false;
  canvas.style.cursor = 'grab';
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  targetCam.zoom = Math.max(0.2, Math.min(4, targetCam.zoom * factor));
}, { passive: false });

let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const node = getNodeAt(t.clientX, t.clientY);
    if (node) {
      const w = screenToWorld(t.clientX, t.clientY);
      dragging   = node;
      dragOffset = { x: node.x - w.x, y: node.y - w.y };
    } else {
      isPanning = true;
      panStart  = { x: t.clientX, y: t.clientY };
    }
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx*dx + dy*dy);
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    if (dragging) {
      const w = screenToWorld(t.clientX, t.clientY);
      dragging.x = w.x + dragOffset.x;
      dragging.y = w.y + dragOffset.y;
      dragging.vx = dragging.vy = 0;
    } else if (isPanning) {
      targetCam.x -= (t.clientX - panStart.x) / cam.zoom;
      targetCam.y -= (t.clientY - panStart.y) / cam.zoom;
      panStart = { x: t.clientX, y: t.clientY };
    }
  } else if (e.touches.length === 2) {
    const dx   = e.touches[0].clientX - e.touches[1].clientX;
    const dy   = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastTouchDist) targetCam.zoom = Math.max(0.2, Math.min(4, targetCam.zoom * (dist/lastTouchDist)));
    lastTouchDist = dist;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (dragging) openPanel(dragging);
  dragging = null; isPanning = false; lastTouchDist = 0;
});

// ── INFO PANEL ──
function openPanel(node) {
  selectedNode = node;
  const cat = categories[node.cat];
  const connections = edges
    .filter(e => e.from === node.id || e.to === node.id)
    .map(e => ({ node: nodeMap[e.from === node.id ? e.to : e.from], strength: e.strength }))
    .filter(c => c.node)
    .sort((a,b) => b.strength - a.strength);

  let html = `
    <div class="panel-category" style="background:${cat.color}22;color:${cat.color}">${cat.icon} ${cat.label}</div>
    <div class="panel-title">${node.label}</div>
    <div class="panel-meta"><div>${connections.length} קשרים</div></div>
  `;
  if (node.desc) html += `<div class="panel-desc">${node.desc}</div>`;
  if (node.url)  html += `<a class="panel-link" href="${node.url}" target="_blank">פתח ב-Google Drive →</a><br><br>`;
  if (connections.length > 0) {
    html += `<div class="panel-connections-title">קשרים</div>`;
    connections.forEach(c => {
      const cc = categories[c.node.cat];
      html += `<div class="panel-connection" data-id="${c.node.id}">
        <div class="conn-dot" style="background:${cc.color}"></div>
        <div>${c.node.label}</div>
      </div>`;
    });
  }

  // Carousel placeholder — filled asynchronously
  html += `<div id="carouselContainer"></div>`;

  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('panel').classList.add('open');
  document.querySelectorAll('.panel-connection').forEach(el => {
    el.addEventListener('click', () => { const n = nodeMap[el.dataset.id]; if (n) openPanel(n); });
  });

  // Load carousel async
  buildCarouselHTML(node).then(carouselHtml => {
    const cc = document.getElementById('carouselContainer');
    if (cc) cc.innerHTML = carouselHtml;
  });
}

document.getElementById('panelClose').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  selectedNode = null;
});

function buildLegend() {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  Object.entries(categories).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className   = 'legend-item';
    item.dataset.key = key;
    if (activeCategory === key) item.classList.add('active');
    item.innerHTML = `<div class="legend-dot" style="background:${cat.color}"></div>${cat.label}`;
    item.addEventListener('click', () => {
      activeCategory = (activeCategory === key) ? null : key;
      buildLegend();
    });
    legendEl.appendChild(item);
  });
}

    siteText: { ...siteText },
    nodes: nodes.map(n => ({ id: n.id, label: n.label, desc: n.desc })),
    cats:  Object.fromEntries(Object.entries(categories).map(([k,v]) => [k, v.label]))

  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.siteText) Object.assign(siteText, data.siteText);
    if (data.nodes) data.nodes.forEach(s => {
      const n = nodeMap[s.id];
      if (n) {
        if (s.label != null) n.label = s.label;
        if (s.desc  != null) n.desc  = s.desc;
      }
    });
    if (data.cats) Object.entries(data.cats).forEach(([key, label]) => {
      if (categories[key] && label != null) categories[key].label = label;
    });
  } catch(e) { /* localStorage unavailable or data corrupt — ignore */ }
}

  siteText.labelEdges = e.target.value;
  document.getElementById('statsLabelEdges').textContent = e.target.value;
  markUnsaved();
});

document.getElementById('editSearchPlaceholder').addEventListener('input', e => {
  siteText.searchPlaceholder = e.target.value;
  document.getElementById('search').placeholder = e.target.value;
  markUnsaved();
});

document.getElementById('adminSaveBtn').addEventListener('click', saveToStorage);

// ── Tab 2: Nodes ──
function populateNodeTab(filter) {
  filter = (filter || '').trim().toLowerCase();
  const container = document.getElementById('nodeEditList');
  const filtered  = filter
    ? nodes.filter(n => n.label.toLowerCase().includes(filter) || categories[n.cat].label.includes(filter))
    : nodes;

  container.innerHTML = filtered.map(n => {
    const cat      = categories[n.cat];
    const labelVal = escHtml(n.label);
    const descVal  = escHtml(n.desc || '');
    return `
      <div class="admin-node-item">
        <div class="admin-node-item-header">
          <span class="admin-node-cat-dot" style="background:${cat.color}"></span>
          <span class="admin-node-cat-label">${cat.label}</span>
        </div>
        <input
          type="text"
          class="admin-input admin-node-label-input"
          data-nid="${n.id}"
          data-field="label"
          value="${labelVal}"
          placeholder="שם הצומת"
        />
        <button class="admin-desc-toggle" data-nid="${n.id}">+ ערוך תיאור</button>
        <div class="admin-desc-area" id="descArea_${n.id}">
          <textarea
            class="admin-textarea"
            data-nid="${n.id}"
            data-field="desc"
            placeholder="תיאור הצומת"
            rows="3"
          >${descVal}</textarea>
        </div>
      </div>
    `;
  }).join('');

  // bind label inputs
  container.querySelectorAll('input[data-field="label"]').forEach(inp => {
    inp.addEventListener('input', e => {
      const node = nodeMap[e.target.dataset.nid];
      if (node) node.label = e.target.value;
      markUnsaved();
    });
  });

  // bind desc textareas
  container.querySelectorAll('textarea[data-field="desc"]').forEach(ta => {
    ta.addEventListener('input', e => {
      const node = nodeMap[e.target.dataset.nid];
      if (node) node.desc = e.target.value;
      markUnsaved();
    });
  });

  // bind desc toggles
  container.querySelectorAll('.admin-desc-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const area = document.getElementById('descArea_' + btn.dataset.nid);
      const open = area.classList.toggle('open');
      btn.textContent = open ? '− סגור תיאור' : '+ ערוך תיאור';
    });
  });
}

document.getElementById('adminNodeSearch').addEventListener('input', e => {
  populateNodeTab(e.target.value);
});

// ── Tab 3: Categories ──
function populateCatTab() {
  const container = document.getElementById('catEditList');
  container.innerHTML = Object.entries(categories).map(([key, cat]) => `
    <div class="admin-cat-item">
      <span class="admin-cat-dot" style="background:${cat.color}"></span>
      <input
        type="text"
        class="admin-input admin-cat-input"
        data-catkey="${key}"
        value="${escHtml(cat.label)}"
        placeholder="שם קטגוריה"
      />
    </div>
  `).join('');

  container.querySelectorAll('input[data-catkey]').forEach(inp => {
    inp.addEventListener('input', e => {
      const key = e.target.dataset.catkey;
      if (categories[key]) {
        categories[key].label = e.target.value;
        buildLegend();
        markUnsaved();
      }
    });
  });
}

// ── Utility ──
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════
// DRIVE CAROUSEL
// ══════════════════════════════════════════════════════
function extractDriveFolderId(url) {
  if (!url) return null;
  const m = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function buildCarouselHTML(node) {
  const folderId = extractDriveFolderId(node.url);
  if (!folderId) return ''; // no Drive folder linked

  if (!DRIVE_API_KEY) {
    return `<div class="carousel-section">
      <div class="carousel-no-key">
        <div class="carousel-no-key-icon">🗂️</div>
        <div>תצוגה מקדימה דורשת מפתח Google Drive API</div>
      </div>
    </div>`;
  }

  const container = document.getElementById('carouselContainer');
  if (container) container.innerHTML = `<div class="carousel-section"><div class="carousel-loading">טוען קבצים...</div></div>`;

  try {
    const q   = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,thumbnailLink,webViewLink)&key=${DRIVE_API_KEY}&pageSize=20`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error ' + res.status);
    const data  = await res.json();
    const files = (data.files || []).filter(f =>
      f.mimeType.startsWith('image/') ||
      f.mimeType.startsWith('video/') ||
      f.mimeType === 'application/vnd.google-apps.video'
    );

    if (!files.length) {
      return `<div class="carousel-section">
        <div class="carousel-no-key">
          <div class="carousel-no-key-icon">📂</div>
          <div>לא נמצאו קבצי מדיה בתיקייה</div>
        </div>
      </div>`;
    }

    const items = files.map((f, i) => {
      const isVideo = f.mimeType.startsWith('video/') || f.mimeType === 'application/vnd.google-apps.video';
      const thumb   = f.thumbnailLink || '';
      const imgTag  = thumb
        ? `<img src="${thumb}" alt="${escHtml(f.name)}" onerror="this.closest('.carousel-thumb').classList.add('thumb-error')" />`
        : '';
      const play    = isVideo ? `<div class="carousel-play-icon">▶</div>` : '';
      return `<div class="carousel-item${i === 0 ? ' active' : ''}">
        <a href="${escHtml(f.webViewLink)}" target="_blank">
          <div class="carousel-thumb">${imgTag}${play}</div>
        </a>
        <div class="carousel-name">${escHtml(f.name)}</div>
      </div>`;
    }).join('');

    return `<div class="carousel-section">
      <div class="carousel-header-row">
        <span class="carousel-title-txt">תיקיית Drive</span>
        <span class="carousel-counter" id="carouselCounter">1 / ${files.length}</span>
      </div>
      ${items}
      ${files.length > 1 ? `<div class="carousel-controls">
        <button class="carousel-arrow" onclick="carouselMove(this, -1)">‹</button>
        <button class="carousel-arrow" onclick="carouselMove(this, 1)">›</button>
      </div>` : ''}
    </div>`;
  } catch(err) {
    return `<div class="carousel-section">
      <div class="carousel-no-key">
        <div class="carousel-no-key-icon">⚠️</div>
        <div>שגיאה בטעינת הקבצים</div>
      </div>
    </div>`;
  }
}

function carouselMove(btn, dir) {
  const section = btn.closest('.carousel-section');
  const items   = section.querySelectorAll('.carousel-item');
  let cur = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) cur = i; });
  items[cur].classList.remove('active');
  cur = (cur + dir + items.length) % items.length;
  items[cur].classList.add('active');
  const counter = section.querySelector('#carouselCounter');
  if (counter) counter.textContent = `${cur + 1} / ${items.length}`;
}

// ── BOOT ──
for (let i = 0; i < 200; i++) simulate();
draw();
